# mus controlled vocabulary — canonical copy.
#
# This is the single source of truth for every annotation `mus`
# validates: experiment-level metadata (organism, tissue, technology,
# …) that applies across all data formats, plus the per-format
# required/soft field lists (h5ad is the first consumer; others will
# follow).
#
# mus fetches the `main` version from Codeberg at runtime:
#   https://codeberg.org/mfiers/mus/raw/branch/main/vocabulary/main.yaml
# with a 24-hour local cache TTL. A build-time copy lives at
# internal/vocab/embedded.yaml as the offline fallback.
#
# h5ad-specific structural rules (matrix dtype, layers["counts"]
# semantics, etc.) are hard-coded in internal/h5ad/check.go — they
# are facts about the file format, not vocabulary.
#
# When the spec changes:
#   1. Edit this file.
#   2. Run `make sync-vocab` (copies into internal/vocab/) — the
#      sync test fails otherwise.
#   3. Commit and push to main on Codeberg.
#   4. Every mus user picks up the new version on their next run
#      (`mus vocab --refresh` to bypass the 24-hour TTL).
#
# Bump schema_version when removing or renaming keys; additions don't
# require a bump.

schema_version: 1

required:
  - organism
  - celltype
  - technology
  - preparation
  - tissue
  - internal
  - accession

soft:
  - doi
  - year
  - contributor
  - region
  - disease
  - sex
  - license
  - source
  - title

vocabulary:

  organism:
    - human          # Homo sapiens
    - mouse          # Mus musculus
    - rat            # Rattus norvegicus
    - macaque        # Macaca mulatta
    - zebrafish      # Danio rerio

  internal:
    - "yes"
    - "no"

  celltype:
    - microglia
    - macrophage
    - dendritic
    - monocyte
    - astrocyte
    - oligodendrocyte
    - opc
    - neuron
    - excitatory_neuron
    - inhibitory_neuron
    - endothelial
    - pericyte
    - fibroblast
    - ependymal
    - vascular
    - myeloid
    - glia
    - mixed

  technology:
    - 10x_chromium_3p_v2
    - 10x_chromium_3p_v3
    - 10x_chromium_5p
    - 10x_multiome
    - 10x_chromium
    - drop_seq
    - smart_seq2
    - smart_seq3
    - cel_seq2
    - parse_evercode
    - bd_rhapsody
    - mars_seq
    - microwell_seq

  preparation:
    - whole_cell
    - single_nucleus
    - cultured
    - xenograft
    - bulk

  tissue:
    - brain
    - blood
    - bone_marrow
    - lung
    - liver
    - spinal_cord
    - retina
    - skin
    - csf

  region:
    - prefrontal_cortex
    - motor_cortex
    - occipital_cortex
    - temporal_cortex
    - parietal_cortex
    - hippocampus
    - striatum
    - thalamus
    - cerebellum
    - midbrain
    - substantia_nigra
    - white_matter
    - subventricular_zone

  disease:
    - control
    - alzheimer
    - parkinson
    - amyotrophic_lateral_sclerosis
    - multiple_sclerosis
    - huntington
    - frontotemporal_dementia
    - down_syndrome
    - autism_spectrum
    - schizophrenia
    - glioma
    - glioblastoma
    - covid

  sex:
    - male
    - female
    - mixed
    - unknown
