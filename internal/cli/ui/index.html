<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mus serve</title>
<style>
  /* Vanilla single-file UI. No framework. ~6 lab depositors, not a SaaS
     product — readability beats slickness. */
  * { box-sizing: border-box; }
  body {
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          system-ui, sans-serif;
    margin: 0; color: #222; background: #fafafa;
  }
  header {
    background: #fff; border-bottom: 1px solid #e0e0e0;
    padding: 0.6em 1em; display: flex; align-items: center; gap: 0.6em;
  }
  header h1 { font-size: 1.1em; margin: 0; flex: 1; }
  header .root { color: #666; font-family: ui-monospace, Menlo, monospace; }
  main {
    display: grid; grid-template-columns: 280px 1fr 360px;
    gap: 0; height: calc(100vh - 50px);
  }
  .panel { padding: 0.8em; overflow-y: auto; background: #fff; }
  .panel + .panel { border-left: 1px solid #e0e0e0; }
  .panel h2 {
    font-size: 0.95em; margin: 0 0 0.6em 0;
    color: #444; text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid #eee; padding-bottom: 0.3em;
  }

  /* Folder tree */
  .crumbs { font-family: ui-monospace, Menlo, monospace; font-size: 0.85em;
            color: #888; margin-bottom: 0.6em; word-break: break-all; }
  .crumbs a { color: #2563eb; text-decoration: none; cursor: pointer; }
  .crumbs a:hover { text-decoration: underline; }
  .tree-row {
    display: flex; align-items: center; padding: 0.25em 0.4em;
    border-radius: 4px; gap: 0.4em;
  }
  .tree-row:hover { background: #f0f4ff; }
  .tree-row .icon { width: 1.1em; text-align: center; color: #888; }
  .tree-row.dir .icon { color: #d97706; }
  .tree-row .name { font-family: ui-monospace, Menlo, monospace;
                    font-size: 0.9em; word-break: break-all; }
  .tree-row .drill { flex: 1; display: flex; align-items: center; gap: 0.4em;
                     cursor: pointer; }
  .tree-row .badge {
    font-size: 0.7em; color: #16a34a; background: #ecfdf5;
    padding: 0.05em 0.4em; border-radius: 3px;
  }
  .tree-row.sidecar { opacity: 0.55; }
  .tree-row.whole-folder {
    background: #fff7ed; border: 1px solid #fed7aa; margin-bottom: 0.3em;
  }
  .tree-row input.select { margin: 0; cursor: pointer; }
  .tree-row .select-spacer { width: 1em; display: inline-block; }

  /* Cascade chips */
  .chips { display: flex; flex-direction: column; gap: 0.4em; margin-bottom: 0.8em; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 0.3em; }
  .chip-group-label {
    font-size: 0.75em; color: #555; text-transform: uppercase;
    letter-spacing: 0.05em; margin-top: 0.2em;
  }
  .chip-group-label.inherited { color: #888; }
  .chip {
    background: #f3f4f6; border-radius: 4px; padding: 0.2em 0.5em;
    font-size: 0.82em; font-family: ui-monospace, Menlo, monospace;
    display: inline-flex; align-items: center; gap: 0.3em;
  }
  .chip.local { background: #ecfdf5; border: 1px solid #a7f3d0; }
  .chip.inherited { opacity: 0.85; }
  .chip b { color: #444; }
  .chip-x {
    background: transparent; border: 0; color: #888;
    cursor: pointer; padding: 0 0.2em; font-size: 1em;
    line-height: 1; border-radius: 2px;
  }
  .chip-x:hover { background: #fee2e2; color: #b91c1c; }

  /* Form */
  form.kv { display: flex; flex-direction: column; gap: 0.6em; }
  form.kv label { font-size: 0.85em; color: #555; }
  form.kv input, form.kv select,
  form.kv #cfg-value-host input, form.kv #cfg-value-host select {
    width: 100%; padding: 0.4em 0.5em;
    border: 1px solid #d0d0d0; border-radius: 4px; font-size: 0.92em;
    font-family: ui-monospace, Menlo, monospace;
    box-sizing: border-box;
  }
  form.kv #cfg-value-host > .row input { width: auto; flex: 1; }
  form.kv .row { display: flex; gap: 0.4em; }
  form.kv .row > * { flex: 1; }
  button {
    padding: 0.4em 0.8em; font-size: 0.9em;
    background: #2563eb; color: #fff; border: 0; border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button.ghost { background: #fff; color: #2563eb; border: 1px solid #2563eb; }
  button.ghost:hover { background: #eff6ff; }
  button.danger { background: #b91c1c; }
  button.danger:hover { background: #991b1b; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Preflight + upload */
  .checks { list-style: none; padding: 0; margin: 0 0 0.8em 0; }
  .checks li {
    display: flex; align-items: center; gap: 0.5em;
    padding: 0.3em 0; border-bottom: 1px solid #f0f0f0;
  }
  .checks .mark { font-weight: bold; width: 1em; text-align: center; }
  .checks .ok  .mark { color: #16a34a; }
  .checks .bad .mark { color: #dc2626; }
  .checks .label { flex: 1; }
  .checks .detail { color: #888; font-size: 0.85em; }

  pre.log {
    background: #0f172a; color: #e2e8f0; padding: 0.6em; border-radius: 4px;
    font-family: ui-monospace, Menlo, monospace; font-size: 0.82em;
    max-height: 40vh; overflow-y: auto; white-space: pre-wrap;
    margin: 0.6em 0 0 0;
  }

  .notice { color: #92400e; background: #fef3c7; padding: 0.4em 0.6em;
            border-radius: 4px; font-size: 0.85em; margin-bottom: 0.6em; }
  .error  { color: #991b1b; background: #fee2e2; padding: 0.4em 0.6em;
            border-radius: 4px; font-size: 0.85em; margin-bottom: 0.6em;
            white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>mus serve</h1>
  <span class="root" id="server-root">…</span>
</header>
<main>
  <!-- LEFT: folder tree -->
  <section class="panel" id="panel-tree">
    <h2>Folders</h2>
    <div class="crumbs" id="crumbs"></div>
    <div id="tree"></div>
  </section>

  <!-- MIDDLE: annotation form (folder-level mus.cfg) -->
  <section class="panel" id="panel-form">
    <h2>Folder annotation (mus.cfg)</h2>
    <div id="form-status"></div>
    <div id="cascade-chips" class="chips"></div>
    <form class="kv" id="cfg-form" autocomplete="off">
      <label for="cfg-key" style="font-size: 0.85em; color: #555;">Key:</label>
      <select id="cfg-key">
        <option value="">— pick a key —</option>
        <!-- populated from /api/known-keys + a "Custom key…" at the bottom -->
      </select>
      <label for="cfg-value-host" style="font-size: 0.85em; color: #555;">Value:</label>
      <div id="cfg-value-host"></div>
      <div class="row" style="margin-top: 0.5em;">
        <button type="button" id="cfg-add">Save</button>
        <button type="button" class="ghost" id="cfg-reset">Reset</button>
      </div>
    </form>
    <h2 style="margin-top: 1.2em;">ELN</h2>
    <div id="eln-status"></div>
    <div class="row">
      <input id="eln-expid" placeholder="experiment_id (e.g. 12345)">
      <input id="eln-dp" placeholder="data_project (required)">
      <button type="button" id="eln-link">Link</button>
    </div>
    <div style="margin-top: 0.5em;">
      <button type="button" class="ghost" id="eln-disable">Disable ELN here</button>
      <button type="button" class="ghost" id="eln-enable">Re-enable</button>
    </div>
  </section>

  <!-- RIGHT: upload action (iRODS-only; ELN comment is automatic) -->
  <section class="panel" id="panel-upload">
    <h2>Pre-flight</h2>
    <ul class="checks" id="checks"></ul>
    <h2>Upload to iRODS</h2>
    <div style="font-size: 0.82em; color: #666; margin-bottom: 0.4em;">
      Select files/folders on the left; check the
      <code>&lt;this folder&gt;</code> row at the top to upload everything.
      ELN comment is logged automatically if the folder is linked.
    </div>
    <label for="upload-msg" style="font-size: 0.85em; color: #555;">
      Message (required — what / why):
    </label>
    <input id="upload-msg" placeholder="e.g. raw data for project Fiers2025">
    <label style="display: flex; align-items: center; gap: 0.4em;
                  margin-top: 0.5em; font-size: 0.85em; color: #555;">
      <input type="checkbox" id="upload-dryrun">
      <span>Dry-run (show what would happen, don't actually upload)</span>
    </label>
    <div class="row" style="margin-top: 0.5em;">
      <button type="button" id="upload-go">Upload selected</button>
    </div>
    <div id="upload-selected-summary"
         style="font-size: 0.82em; color: #555; margin-top: 0.4em;"></div>
    <pre class="log" id="upload-log" hidden></pre>
  </section>
</main>

<script>
'use strict';

// ── state ──────────────────────────────────────────────────────────────
let currentDir = '';   // relative to serveRoot; "" = root
let serverRoot = '';

// ── helpers ────────────────────────────────────────────────────────────
async function api(path, opts) {
  const r = await fetch(path, opts);
  const text = await r.text();
  if (!r.ok) throw new Error(text.trim() || ('HTTP ' + r.status));
  return text ? JSON.parse(text) : null;
}
async function apiPost(path, body) {
  return api(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class')      e.className = attrs[k];
    else if (k === 'on')    for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]);
    else if (k.startsWith('data-')) e.setAttribute(k, attrs[k]);
    else                    e[k] = attrs[k];
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
function showError(div, msg) {
  div.innerHTML = '';
  div.appendChild(el('div', { class: 'error' }, msg));
}
function showNotice(div, msg) {
  div.innerHTML = '';
  div.appendChild(el('div', { class: 'notice' }, msg));
}
function clearStatus(div) { div.innerHTML = ''; }

// ── boot ───────────────────────────────────────────────────────────────
async function boot() {
  try {
    const r = await api('/api/cwd');
    serverRoot = r.root;
    document.getElementById('server-root').textContent = serverRoot;
  } catch (e) { /* leave header blank */ }
  await refreshAll();
}

async function refreshAll() {
  renderCrumbs();
  await Promise.all([refreshTree(), refreshCascade(), refreshPreflight()]);
}

// ── crumbs ─────────────────────────────────────────────────────────────
function renderCrumbs() {
  const c = document.getElementById('crumbs');
  c.innerHTML = '';
  c.appendChild(el('a', { on: { click: () => navigate('') } }, '<root>'));
  if (!currentDir) return;
  const parts = currentDir.split('/');
  let acc = '';
  for (const p of parts) {
    c.appendChild(document.createTextNode(' / '));
    acc = acc ? acc + '/' + p : p;
    const target = acc;
    c.appendChild(el('a', { on: { click: () => navigate(target) } }, p));
  }
}
function navigate(dir) {
  currentDir = dir;
  refreshAll();
}

// ── folder tree with selectable rows ──────────────────────────────────
// Selection is BY ABSOLUTE-IN-SERVE-ROOT PATH (the e.path the API
// returns). Sidecars are not selectable — mus s.. err mus irods upload
// skips them automatically AND the depositor shouldn't be picking them
// individually. A synthetic "<this folder>" row at the top lets the
// user upload the current cwd as one unit.
const selectedPaths = new Set();   // keys: tree entry .path (or "" for cwd)

async function refreshTree() {
  const root = document.getElementById('tree');
  root.innerHTML = '';
  // Synthetic "this folder" row.
  const wholeRow = el('div', { class: 'tree-row dir whole-folder' });
  const wholeChk = el('input', { type: 'checkbox', class: 'select',
    checked: selectedPaths.has(''),
    on: { change: e => toggleSelect('', e.target.checked, true) } });
  wholeRow.appendChild(wholeChk);
  wholeRow.appendChild(el('span', { class: 'icon' }, '⌂'));
  wholeRow.appendChild(el('span', { class: 'name', style: 'font-weight: 600;' },
    '<this folder>' + (currentDir ? ' (' + currentDir + ')' : '')));
  root.appendChild(wholeRow);
  try {
    const r = await api('/api/tree?dir=' + encodeURIComponent(currentDir));
    for (const e of r.entries) {
      const isDir = e.kind === 'dir';
      const isSidecar = e.kind === 'sidecar';
      const row = el('div', { class: 'tree-row ' + e.kind });
      // Checkbox for files + directories. Sidecars stay non-
      // selectable (greyed) — they ride along with their data file.
      if (!isSidecar) {
        const chk = el('input', { type: 'checkbox', class: 'select',
          checked: selectedPaths.has(e.path),
          on: { change: ev => toggleSelect(e.path, ev.target.checked, false) } });
        row.appendChild(chk);
      } else {
        row.appendChild(el('span', { class: 'select-spacer' }));
      }
      // Click-to-drill on the icon+name area only — checkbox events
      // shouldn't trigger navigation.
      const drill = el('span', { class: 'drill',
        on: { click: () => isDir && navigate(e.path) } });
      drill.appendChild(el('span', { class: 'icon' },
        isDir ? '▸' : (isSidecar ? '·' : '◦')));
      drill.appendChild(el('span', { class: 'name' }, e.name));
      row.appendChild(drill);
      if (e.has_mus_cfg) row.appendChild(el('span', { class: 'badge' }, 'cfg'));
      root.appendChild(row);
    }
    if (r.entries.length === 0) {
      root.appendChild(el('div', { class: 'notice' }, 'empty folder'));
    }
  } catch (e) {
    showError(root, 'tree error: ' + e.message);
  }
  refreshSelectionSummary();
}

// toggleSelect mutates selectedPaths. The "<this folder>" entry is
// mutually exclusive with individual rows — picking it clears the
// rest, and picking any individual row clears it.
function toggleSelect(path, on, isWholeFolder) {
  if (on) {
    if (isWholeFolder) {
      selectedPaths.clear();
      selectedPaths.add('');
    } else {
      selectedPaths.delete('');
      selectedPaths.add(path);
    }
  } else {
    selectedPaths.delete(path);
  }
  refreshTree();              // re-render to sync the other checkboxes
}

function refreshSelectionSummary() {
  const summary = document.getElementById('upload-selected-summary');
  if (selectedPaths.size === 0) {
    summary.textContent = 'nothing selected';
    document.getElementById('upload-go').disabled = true;
    return;
  }
  if (selectedPaths.has('')) {
    summary.textContent = 'selected: <this folder>' +
      (currentDir ? ' (' + currentDir + ')' : '');
  } else {
    const items = [...selectedPaths];
    summary.textContent = 'selected: ' + items.length + ' item(s) — ' +
      items.slice(0, 3).join(', ') + (items.length > 3 ? ', …' : '');
  }
  document.getElementById('upload-go').disabled = false;
}

// ── cascade + form ─────────────────────────────────────────────────────
async function refreshCascade() {
  const chips = document.getElementById('cascade-chips');
  const status = document.getElementById('form-status');
  chips.innerHTML = ''; clearStatus(status);
  try {
    const r = await api('/api/cascade?dir=' + encodeURIComponent(currentDir));
    const local = r.values.filter(v => v.local);
    const inherited = r.values.filter(v => !v.local);
    if (local.length > 0) {
      chips.appendChild(el('div', { class: 'chip-group-label' }, 'set in this folder:'));
      const group = el('div', { class: 'chip-group' });
      for (const v of local) group.appendChild(renderChip(v, true));
      chips.appendChild(group);
    }
    if (inherited.length > 0) {
      chips.appendChild(el('div', { class: 'chip-group-label inherited' },
        'inherited from cascade:'));
      const group = el('div', { class: 'chip-group' });
      for (const v of inherited) group.appendChild(renderChip(v, false));
      chips.appendChild(group);
    }
    if (local.length + inherited.length === 0) {
      chips.appendChild(el('div', { class: 'notice' },
        'no cascade values — start by setting `data_project`'));
    }
    refreshELNState(r.values);
  } catch (e) {
    showError(status, 'cascade error: ' + e.message);
  }
}

// renderChip builds one chip. Local chips get an × that calls
// /api/config/unset on the LOCAL mus.cfg. Inherited chips are
// read-only (the × wouldn't apply at this level anyway).
function renderChip(v, isLocal) {
  const chip = el('div', { class: 'chip' + (isLocal ? ' local' : ' inherited') });
  chip.appendChild(el('b', null, v.key + '='));
  chip.appendChild(document.createTextNode(v.value + (v.is_list ? ' (list)' : '')));
  if (isLocal) {
    const x = el('button', {
      type: 'button',
      class: 'chip-x',
      title: 'unset ' + v.key + ' from this folder\'s mus.cfg',
      on: { click: () => unsetKey(v.key) },
    }, '×');
    chip.appendChild(x);
  }
  return chip;
}

async function unsetKey(key) {
  const status = document.getElementById('form-status');
  if (!confirm('Remove `' + key + '` from this folder\'s mus.cfg?\n'+
               '(Inherited values from parent folders are unaffected.)')) {
    return;
  }
  try {
    await apiPost('/api/config/unset', { dir: currentDir, key });
    showNotice(status, 'unset ' + key + ' from local mus.cfg');
    refreshAll();
  } catch (e) {
    showError(status, e.message);
  }
}

function refreshELNState(values) {
  const elnDiv = document.getElementById('eln-status');
  elnDiv.innerHTML = '';
  const mp = {};
  for (const v of values) mp[v.key] = v.value;
  if (mp.eln_experiment_id) {
    elnDiv.appendChild(el('div', { class: 'chip' },
      el('b', null, 'linked: '),
      'experiment ' + mp.eln_experiment_id + ' (' + (mp.eln_experiment_name || '?') + ')'));
  } else if (mp.eln_disabled === 'true') {
    elnDiv.appendChild(el('div', { class: 'chip' },
      el('b', null, 'disabled '), 'for this folder'));
  } else {
    elnDiv.appendChild(el('div', { class: 'notice' },
      'ELN state undecided — link an experiment or disable below'));
  }
}

// ── vocab-driven annotation form ──────────────────────────────────────
//
// Key dropdown: populated from /api/known-keys (which lists every
// recognised mus.cfg key + whether it's vocab-controlled). Picking
// "Custom key…" exposes a free-text input for anything outside the
// known set — depositor still needs to be sane, but mus's vocab
// validation will catch obvious mistakes server-side.
//
// Value rendering: changes based on key type.
//   - Vocab-controlled key (organism, tissue, …): <select> from
//     /api/vocab/<key> with a "Custom value (force-set)…" option
//     at the bottom for off-vocab cases.
//   - Anything else: free <input>.

let knownKeys = [];   // [{key, vocab}] from /api/known-keys

async function loadKnownKeys() {
  try {
    const r = await api('/api/known-keys');
    knownKeys = r.keys || [];
    const sel = document.getElementById('cfg-key');
    sel.innerHTML = '<option value="">— pick a key —</option>';
    for (const k of knownKeys) {
      const label = k.key + (k.vocab ? '  (vocab)' : '');
      sel.appendChild(el('option', { value: k.key }, label));
    }
    sel.appendChild(el('option', { value: '__CUSTOM__' }, 'Custom key…'));
  } catch (e) {
    // Non-fatal — depositor can still use Custom key input
    knownKeys = [];
  }
}

// Render the value input based on the currently-selected key.
let pendingCustomKey = '';  // when Custom key… is chosen
let pendingValueIsCustom = false;

document.getElementById('cfg-key').addEventListener('change', async () => {
  const sel = document.getElementById('cfg-key');
  if (sel.value === '__CUSTOM__') {
    // Show a custom-key text input + free value input.
    pendingCustomKey = '';
    pendingValueIsCustom = true;
    renderCustomKeyField();
    return;
  }
  pendingValueIsCustom = false;
  renderValueField(sel.value);
});

function renderCustomKeyField() {
  const host = document.getElementById('cfg-value-host');
  host.innerHTML = '';
  const wrap = el('div', { class: 'row' });
  const keyInp = el('input', { id: 'cfg-custom-key', placeholder: 'custom key (e.g. comment)' });
  const valInp = el('input', { id: 'cfg-custom-val', placeholder: 'value (free text)' });
  wrap.appendChild(keyInp);
  wrap.appendChild(valInp);
  host.appendChild(wrap);
  host.appendChild(el('div', { class: 'notice' },
    'Custom key — must follow the cascading mus.cfg convention. ' +
    'Off-vocab values are saved with --force and a stderr warning.'));
}

async function renderValueField(key) {
  const host = document.getElementById('cfg-value-host');
  host.innerHTML = '';
  if (!key) { return; }
  const info = knownKeys.find(k => k.key === key);
  const isVocab = info && info.vocab;
  if (!isVocab) {
    // Free-text input. Some keys have known shape — could nudge
    // here later (e.g. eln_experiment_id digits-only) but keep
    // simple for v1.
    const inp = el('input', { id: 'cfg-val', placeholder: 'value' });
    host.appendChild(inp);
    return;
  }
  // Vocab-controlled — fetch the list and render a <select> with
  // a "Custom value (force-set)…" escape hatch.
  try {
    const r = await api('/api/vocab/' + encodeURIComponent(key));
    const sel = el('select', { id: 'cfg-val' });
    sel.appendChild(el('option', { value: '' }, '— pick a value —'));
    for (const v of (r.values || [])) {
      sel.appendChild(el('option', { value: v }, v));
    }
    sel.appendChild(el('option', { value: '__CUSTOMVAL__' }, 'Custom value (force-set)…'));
    sel.addEventListener('change', () => {
      if (sel.value === '__CUSTOMVAL__') {
        // Replace with a free input that force-sets server-side.
        const free = el('input', { id: 'cfg-val', placeholder: 'off-vocab value' });
        host.replaceChild(free, sel);
        host.appendChild(el('div', { class: 'notice' },
          'Off-vocab value will be saved with --force. ' +
          'If this term should be added to the controlled vocabulary, ' +
          'open an issue at codeberg.org/mfiers/mus.'));
        free.focus();
      }
    });
    host.appendChild(sel);
  } catch (e) {
    // Vocab fetch failed — degrade to free text rather than block.
    host.appendChild(el('input', { id: 'cfg-val', placeholder: 'value (vocab unavailable)' }));
  }
}

// Save handler — reads whichever input combination is currently rendered.
document.getElementById('cfg-add').addEventListener('click', async () => {
  const status = document.getElementById('form-status');
  let key, value, isCustomKey = false, isCustomVal = false;
  if (pendingValueIsCustom) {
    key = (document.getElementById('cfg-custom-key') || {}).value || '';
    value = (document.getElementById('cfg-custom-val') || {}).value || '';
    isCustomKey = true;
  } else {
    key = document.getElementById('cfg-key').value;
    const valEl = document.getElementById('cfg-val');
    value = valEl ? valEl.value : '';
    // If the value input came from the "Custom value (force-set)…"
    // path, the element was replaced from <select> to <input>; flag it.
    isCustomVal = valEl && valEl.tagName === 'INPUT';
  }
  key = (key || '').trim();
  value = (value || '').trim();
  if (!key || !value) {
    showError(status, 'both key and value are required');
    return;
  }
  // Force only when the depositor explicitly picked the off-vocab
  // escape hatch (either custom key OR custom value on a vocab-
  // controlled field). The server's normalisation message is the
  // real source of truth — we just don't refuse on a deliberate
  // off-vocab pick.
  const force = isCustomKey || isCustomVal;
  try {
    const r = await apiPost('/api/config/set',
      { dir: currentDir, key, value, force });
    if (r.key !== key || r.value !== value) {
      showNotice(status,
        'normalised → ' + r.key + '=' + r.value + (r.notes ? '\n' + r.notes : ''));
    } else {
      showNotice(status, 'saved ' + r.key + '=' + r.value);
    }
    document.getElementById('cfg-key').value = '';
    document.getElementById('cfg-value-host').innerHTML = '';
    pendingValueIsCustom = false;
    refreshAll();
  } catch (e) {
    showError(status, e.message);
  }
});

document.getElementById('cfg-reset').addEventListener('click', () => {
  document.getElementById('cfg-key').value = '';
  document.getElementById('cfg-value-host').innerHTML = '';
  clearStatus(document.getElementById('form-status'));
  pendingValueIsCustom = false;
});

// ── ELN actions ────────────────────────────────────────────────────────
document.getElementById('eln-link').addEventListener('click', async () => {
  const expid = document.getElementById('eln-expid').value.trim();
  const dp = document.getElementById('eln-dp').value.trim();
  const status = document.getElementById('form-status');
  if (!expid || !dp) {
    showError(status, 'experiment_id AND data_project are required');
    return;
  }
  try {
    await apiPost('/api/eln/link',
      { dir: currentDir, experiment_id: expid, data_project: dp });
    showNotice(status, 'linked to experiment ' + expid + ' (data_project=' + dp + ')');
    refreshAll();
  } catch (e) { showError(status, e.message); }
});
document.getElementById('eln-disable').addEventListener('click', async () => {
  const status = document.getElementById('form-status');
  try {
    await apiPost('/api/eln/disable', { dir: currentDir });
    showNotice(status, 'ELN disabled for this folder');
    refreshAll();
  } catch (e) { showError(status, e.message); }
});
document.getElementById('eln-enable').addEventListener('click', async () => {
  const status = document.getElementById('form-status');
  try {
    await apiPost('/api/eln/enable', { dir: currentDir });
    showNotice(status, 'ELN re-enabled (now undecided — link an experiment)');
    refreshAll();
  } catch (e) { showError(status, e.message); }
});

// ── pre-flight ─────────────────────────────────────────────────────────
async function refreshPreflight() {
  const ul = document.getElementById('checks');
  ul.innerHTML = '';
  try {
    const r = await api('/api/preflight?dir=' + encodeURIComponent(currentDir));
    let canUpload = true;
    for (const c of r.checks) {
      const li = el('li', { class: c.ok ? 'ok' : 'bad' });
      li.appendChild(el('span', { class: 'mark' }, c.ok ? '✓' : '✗'));
      li.appendChild(el('span', { class: 'label' }, c.label));
      li.appendChild(el('span', { class: 'detail' }, c.detail));
      ul.appendChild(li);
      if (!c.ok && c.block_upload) canUpload = false;
    }
    // Re-evaluate selection summary (which also flips the button
    // when nothing is selected).
    refreshSelectionSummary();
    if (!canUpload) {
      document.getElementById('upload-go').disabled = true;
    }
  } catch (e) {
    showError(ul, 'preflight error: ' + e.message);
  }
}

// ── upload (iRODS only; whatever is in selectedPaths) ───────────────
async function triggerUpload() {
  const message = document.getElementById('upload-msg').value.trim();
  const dryRun = document.getElementById('upload-dryrun').checked;
  const log = document.getElementById('upload-log');
  if (!message) {
    log.hidden = false;
    log.textContent = 'ERROR: upload message is required — describe what / why.';
    return;
  }
  if (selectedPaths.size === 0) {
    log.hidden = false;
    log.textContent = 'ERROR: select at least one file/folder (or the <this folder> row).';
    return;
  }
  const paths = [...selectedPaths]; // "" stays "" → whole folder
  const summary = paths.includes('')
    ? '<this folder>' + (currentDir ? ' (' + currentDir + ')' : '')
    : paths.length + ' item(s)';
  // Skip the confirm() prompt on dry-run — no side effects to
  // confirm. The depositor probably wants to flip the checkbox
  // on/off rapidly to compare.
  if (!dryRun && !confirm('Upload ' + summary + ' to iRODS with message "' + message +
               '"? This has external side effects.')) {
    return;
  }
  log.hidden = false;
  log.textContent = dryRun ? '(dry-run — no bytes will transfer)\n' : '';
  const goBtn = document.getElementById('upload-go');
  goBtn.disabled = true;
  try {
    const r = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths, message, dry_run: dryRun }),
    });
    if (!r.ok) {
      const t = await r.text();
      log.textContent = 'ERROR: ' + t;
      return;
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value, { stream: true });
      log.scrollTop = log.scrollHeight;
    }
  } catch (e) {
    log.textContent += '\n\nERROR: ' + e.message;
  } finally {
    refreshPreflight();
  }
}
document.getElementById('upload-go').addEventListener('click', triggerUpload);

// ── go ─────────────────────────────────────────────────────────────────
loadKnownKeys().then(boot);
</script>
